name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: quay.io
  IMAGE_NAME: kubernaut-ai/kubernaut-console

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # QUAY_USERNAME/QUAY_PASSWORD is the robot with Write access on
          # kubernaut-ai/kubernaut-console (the same robot upstream kubernaut
          # uses). QUAY_CICD_* is a separate robot scoped to the kubernaut-cicd
          # org (used below by tag-visual-baselines) and does not have access
          # to this repo -- PR #60 switched this job to QUAY_CICD_* on a wrong
          # assumption, which made every push fail with "unauthorized".
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/standalone/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # #74: the SLSA3 provenance job below is a reusable *workflow call*
      # (`uses:`), not a step -- its `with:` block can't see this job's
      # `env` context (env vars aren't propagated into reusable-workflow
      # inputs), so the image ref has to be surfaced as a job output like
      # `digest` already is, rather than referenced inline via env.REGISTRY.
      - name: Resolve image ref
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # ========================================
  # SLSA Build Level 3 provenance
  #
  # #74: upgraded from actions/attest-build-provenance (SLSA Build L1-2,
  # self-attested by this same workflow) to slsa-framework/slsa-github-
  # generator's container workflow (SLSA Build L3). The build/push steps
  # above are unchanged -- this generator attests an already-built/pushed
  # digest, it does not build the image itself (only the generator's
  # ecosystem-specific *builders*, e.g. its Go builder, do that):
  #
  # - Before: the "Attest build provenance" step ran as part of *this*
  #   repo's own job, so the provenance's builder identity was
  #   self-asserted (release.yaml attesting to its own build).
  # - After: this job is a *reusable workflow call* (`uses:`, not a step),
  #   so GitHub mints its OIDC token against the *generator's* job, not
  #   ours. The resulting provenance's builder.id is slsa-github-
  #   generator's own pinned identity
  #   (.../generator_container_slsa3.yml@refs/tags/v2.1.0) -- this repo
  #   can only supply `image`/`digest` as inputs, it cannot forge or
  #   influence the attestation's builder identity or signing material.
  #
  # Only one provenance job is needed (unlike per-arch setups) because
  # `build-and-push` already publishes a single multi-arch manifest-list
  # digest via buildx, not separate per-arch images.
  #
  # Must be pinned by an exact release tag (@vX.Y.Z); referencing it by a
  # shorter tag or by commit hash fails at run time -- an open upstream
  # limitation, not a mistake here: GitHub's OIDC token for a reusable
  # workflow call only reliably reports the ref it was invoked at, so
  # slsa-verifier can't yet confirm an arbitrary hash maps to a trusted
  # release (see https://github.com/slsa-framework/slsa-verifier/issues/12).
  #
  # `packages: write` is required by the generator's own reusable workflow
  # permission declarations even though we push to Quay, not ghcr.io -- an
  # acknowledged upstream quirk (see slsa-github-generator#1257).
  # ========================================

  provenance:
    name: SLSA3 provenance
    needs: build-and-push
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build-and-push.outputs.image }}
      digest: ${{ needs.build-and-push.outputs.digest }}
    secrets:
      registry-username: ${{ secrets.QUAY_USERNAME }}
      registry-password: ${{ secrets.QUAY_PASSWORD }}

  trivy-scan:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always()

  tag-visual-baselines:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Install oras
        run: |
          curl -LO https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz
          tar -xzf oras_1.2.2_linux_amd64.tar.gz -C /usr/local/bin oras
          rm oras_1.2.2_linux_amd64.tar.gz

      - name: Login to Quay.io
        run: echo "${{ secrets.QUAY_CICD_PASSWORD }}" | oras login quay.io --username "${{ secrets.QUAY_CICD_USERNAME }}" --password-stdin

      - name: Tag baselines with release version
        run: oras cp quay.io/kubernaut-cicd/visual-baselines:latest quay.io/kubernaut-cicd/visual-baselines:${{ github.ref_name }}

  helm-package:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Update Chart appVersion
        run: |
          sed -i "s/appVersion:.*/appVersion: \"${GITHUB_REF_NAME#v}\"/" chart/Chart.yaml
          sed -i "s/version:.*/version: ${GITHUB_REF_NAME#v}/" chart/Chart.yaml

      - run: helm package chart/

      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: "*.tgz"
          retention-days: 30
