name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: quay.io
  IMAGE_NAME: kubernaut-ai/kubernaut-console

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # QUAY_USERNAME/QUAY_PASSWORD is the robot with Write access on
          # kubernaut-ai/kubernaut-console (the same robot upstream kubernaut
          # uses). QUAY_CICD_* is a separate robot scoped to the kubernaut-cicd
          # org (used below by tag-visual-baselines) and does not have access
          # to this repo -- PR #60 switched this job to QUAY_CICD_* on a wrong
          # assumption, which made every push fail with "unauthorized".
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/standalone/Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # #74: the SLSA3 provenance job below is a reusable *workflow call*
      # (`uses:`), not a step -- its `with:` block can't see this job's
      # `env` context (env vars aren't propagated into reusable-workflow
      # inputs), so the image ref has to be surfaced as a job output like
      # `digest` already is, rather than referenced inline via env.REGISTRY.
      - name: Resolve image ref
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  # ========================================
  # SLSA Build Level 3 provenance
  #
  # #74: upgraded from actions/attest-build-provenance running inline in
  # build-and-push (SLSA Build L1-2, self-attested by this same job) to the
  # same action called from an isolated same-repo reusable workflow
  # (SLSA Build L3). See ./slsa-provenance.yml for the isolation rationale
  # and why this deliberately does NOT use slsa-framework/slsa-github-
  # generator (now unmaintained) -- confirmed via an A/B spike against
  # Quay.io in kubernaut#1109:
  # https://github.com/jordigilh/kubernaut/issues/1109#issuecomment-5231483895
  #
  # Only one provenance call is needed (unlike per-arch setups elsewhere)
  # because `build-and-push` already publishes a single multi-arch
  # manifest-list digest via buildx, not separate per-arch images.
  # ========================================

  provenance:
    name: SLSA3 provenance
    needs: build-and-push
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/slsa-provenance.yml
    with:
      image: ${{ needs.build-and-push.outputs.image }}
      digest: ${{ needs.build-and-push.outputs.digest }}
    secrets:
      registry-username: ${{ secrets.QUAY_USERNAME }}
      registry-password: ${{ secrets.QUAY_PASSWORD }}

  trivy-scan:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      security-events: write
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        if: always()

  tag-visual-baselines:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Install oras
        run: |
          curl -LO https://github.com/oras-project/oras/releases/download/v1.2.2/oras_1.2.2_linux_amd64.tar.gz
          tar -xzf oras_1.2.2_linux_amd64.tar.gz -C /usr/local/bin oras
          rm oras_1.2.2_linux_amd64.tar.gz

      - name: Login to Quay.io
        run: echo "${{ secrets.QUAY_CICD_PASSWORD }}" | oras login quay.io --username "${{ secrets.QUAY_CICD_USERNAME }}" --password-stdin

      - name: Tag baselines with release version
        run: oras cp quay.io/kubernaut-cicd/visual-baselines:latest quay.io/kubernaut-cicd/visual-baselines:${{ github.ref_name }}
