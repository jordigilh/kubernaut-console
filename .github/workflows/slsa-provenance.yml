name: SLSA Provenance Attestation

# Isolated reusable workflow: generates SLSA v1.0 Build L3 provenance for a
# single OCI image digest. Runs as its own job with its own OIDC identity, so
# the calling workflow (release.yaml) cannot influence or forge the resulting
# attestation -- this isolation is what upgrades provenance from Build L2
# (self-asserted, generated inline in the same job that built the image) to
# Build L3 (non-falsifiable, generated by a trusted component the build
# cannot tamper with).
#
# Deliberately still uses actions/attest-build-provenance (the same,
# actively-maintained GitHub-native action already used for L1-2 here) rather
# than slsa-framework/slsa-github-generator: that project is no longer
# actively maintained (frozen at v2.1.0, Feb 2025) and its own docs now
# recommend this native-attestation + isolated-reusable-workflow pattern
# instead. Confirmed against Quay.io via an A/B spike in kubernaut#1109:
# https://github.com/jordigilh/kubernaut/issues/1109#issuecomment-5231483895
#
# Authority: #74 (companion: kubernaut#1109, kubernaut-operator#93/#305)

on:
  workflow_call:
    inputs:
      image:
        description: "Fully-qualified image name, no tag/digest (e.g., quay.io/kubernaut-ai/kubernaut-console)"
        required: true
        type: string
      digest:
        description: "Image digest to attest, in the form sha256:<hex>"
        required: true
        type: string
    secrets:
      registry-username:
        description: "Username to log into the container registry."
        required: true
      registry-password:
        description: "Password to log into the container registry."
        required: true

jobs:
  attest:
    name: SLSA build provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # OIDC token for Sigstore signing
      attestations: write # Persist the attestation via the GH attestations API
      artifact-metadata: write # Artifact storage record (push-to-registry: true)
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      # kubernaut#1109 spike finding: registry auth for push-to-registry: true
      # (and for consumers running `gh attestation verify oci://...` later)
      # must go through `cosign login`, not `docker login`/`podman login`
      # alone -- both read credentials from the same Docker-config-style
      # keychain that `cosign login` populates.
      - name: Login to registry (Cosign)
        run: |
          REGISTRY="$(echo "${{ inputs.image }}" | cut -d'/' -f1)"
          cosign login -u "${{ secrets.registry-username }}" \
                       -p "${{ secrets.registry-password }}" \
                       "${REGISTRY}"

      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ inputs.digest }}
          push-to-registry: true
