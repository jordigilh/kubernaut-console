name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Check offline console design regressions
        run: node scripts/check-console-design.mjs
        env:
          DESIGN_CHECK_OUTPUT_DIR: ${{ runner.temp }}/console-design-smoke

      - name: Run standalone E2E
        run: VITE_MOCK_A2A=true npx playwright test e2e/standalone.spec.ts
        env:
          CI: true

      - name: Run accessibility E2E
        run: VITE_MOCK_A2A=true npx playwright test e2e/accessibility.spec.ts
        env:
          CI: true

      - name: Run source-only console foundation E2E
        id: console-foundation
        run: npx playwright test --config playwright.console-foundation.config.ts
        env:
          CI: true
          CONSOLE_FOUNDATION_OUTPUT_DIR: ${{ runner.temp }}/console-foundation-e2e

      - name: Bundle size check
        run: ./scripts/bundle-size.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload offline design check results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-design-smoke
          path: ${{ runner.temp }}/console-design-smoke/
          retention-days: 7

      - name: Upload console foundation failure traces
        if: failure() && steps.console-foundation.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-foundation-e2e
          path: ${{ runner.temp }}/console-foundation-e2e/
          if-no-files-found: ignore
          retention-days: 7
