name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run standalone E2E
        run: VITE_MOCK_A2A=true npx playwright test e2e/standalone.spec.ts
        env:
          CI: true

      - name: Run accessibility E2E
        run: VITE_MOCK_A2A=true npx playwright test e2e/accessibility.spec.ts
        env:
          CI: true

      - name: Bundle size check
        run: ./scripts/bundle-size.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
