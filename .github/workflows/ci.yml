name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify console design references
        run: python3 scripts/check-console-design.py

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Verify ui-core output
        run: |
          test -f packages/ui-core/dist/index.js
          test -f packages/ui-core/dist/index.d.ts

      - name: Verify standalone output
        run: test -d packages/standalone/dist

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH

      # Build the standalone artifact locally so pull requests do not depend
      # on a registry tag or credentials. The release workflow separately
      # scans its published multi-architecture image by immutable digest.
      - name: Build standalone image for scanning
        run: docker build --platform linux/amd64 --tag kubernaut-console:ci-scan --file packages/standalone/Containerfile .

      - name: Smoke-test standalone image
        timeout-minutes: 1
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' kubernaut-console:ci-scan)" = "1001"
          container=$(docker run --detach --rm --publish 127.0.0.1::8080 kubernaut-console:ci-scan)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          address=$(docker port "$container" 8080/tcp)
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            --retry-max-time 30 "http://$address/" --output "$RUNNER_TEMP/console-index.html"
          grep -q '<div id="root"></div>' "$RUNNER_TEMP/console-index.html"

      - name: Run Trivy standalone image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kubernaut-console:ci-scan
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy filesystem SARIF
        # Fork PR tokens cannot write code-scanning results; the vulnerability
        # gate still runs, but SARIF upload is only attempted where permitted.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload Trivy image SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
