version: 2

updates:
  # The workspace shares one pnpm lockfile. Keep all workspace importers in
  # one update definition so related npm changes are grouped into one PR.
  - package-ecosystem: npm
    directories:
      - /
      - /packages/standalone
      - /packages/ui-core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    # TypeScript 7.0 has no stable JavaScript compiler API yet. Keep 7.0.x
    # blocked, but let Dependabot surface 7.1.x for an explicit review.
    ignore:
      - dependency-name: typescript
        versions:
          - "7.0.x"
    groups:
      all-npm-deps:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      all-actions:
        patterns:
          - '*'

  # Dependabot supports Containerfile names in the Docker ecosystem. This
  # keeps UBI base-image bumps grouped into one PR for the standalone image.
  - package-ecosystem: docker
    directory: /packages/standalone
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: docker
    groups:
      all-docker:
        patterns:
          - '*'
